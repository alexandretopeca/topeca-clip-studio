[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topeca-clip-studio"
version = "0.1.0a1"
description = "Desktop application for organizing gameplay recordings and preparing video clips."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["topeca_clip_studio*"]
